<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Chan</title>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .chan-header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-size: 20px; font-weight: bold; color: #1877f2; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        .notif-card { background: #ffffff; padding: 12px 15px; border-radius: 8px; margin-top: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 14px; color: #050505; }
        .chan-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e4e6eb; padding: 6px 0; z-index: 1000; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: #65676b; text-decoration: none; flex: 1; }
        .bottom-nav-item.active { color: #1877f2; }
        .bottom-nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .bottom-nav-item span { font-size: 10px; margin-top: 3px; font-weight: bold; }
        .create-circle-btn { width: 44px; height: 44px; background: linear-gradient(135deg, #a855f7, #9333ea); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin: auto; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chan-header">Notifications</div>
    <div class="container">
        {% if notifications %}
            {% for notif in notifications %}
                <div class="notif-card">
                    🔔 {{ notif.message }}
                </div>
            {% endfor %}
        {% else %}
            <p style="text-align: center; color: #65676b; margin-top: 40px;">No notifications yet.</p>
        {% endif %}
    </div>

    <!-- Bottom Nav -->
    <div class="chan-bottom-nav">
        <a href="{{ url_for('index') }}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3l-10 9h3v9h5v-6h4v6h5v-9h3z"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="bottom-nav-item" onclick="alert('Friends tab coming soon!')">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Friends</span>
        </a>
        <div style="flex: 1; text-align: center;">
            <div class="create-circle-btn" onclick="window.location.href='{{ url_for('index') }}'">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: currentColor;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
        </div>
        <a href="{{ url_for('notifications') }}" class="bottom-nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
            <span>Notifications</span>
        </a>
        <a href="{{ url_for('profile', username=current_user.username) }}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>Menu</span>
        </a>
    </div>
</body>
</html>
