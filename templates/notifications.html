    <!-- Bottom Nav with Unread Badge Calculation -->
    {% set unread_count = current_user.notifications | selectattr('is_read', 'equalto', false) | list | length %}
    <div class="chan-bottom-nav">
        <a href="{{ url_for('index') }}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3l-10 9h3v9h5v-6h4v6h5v-9h3z"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="bottom-nav-item" onclick="alert('Friends tab coming soon!')">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Friends</span>
        </a>
        <div style="flex: 1; text-align: center;">
            <div class="create-circle-btn" onclick="window.location.href='{{ url_for('index') }}'">

            </div>
        </div>
        <a href="{{ url_for('notif_bp.notifications') }}" class="bottom-nav-item active">

            <span>Notifications</span>
            {% if unread_count > 0 %}
                <span class="badge-count">{{ unread_count }}</span>
            {% endif %}
        </a>
        <a href="{{ url_for('profile', username=current_user.username) }}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>Menu</span>
